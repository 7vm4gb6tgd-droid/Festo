<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#0b1f33}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<title>Festo Tools Guide</title><style id="css">/* Layout: one phone-sized card that flips page to page, as in the Staff Pocket Guide. Single light theme in Festo blue and navy, set deliberately. */
:root{
  --blue:#0091dc;--blue-dk:#0079bd;--navy:#12295a;--ink:#33414f;--mute:#5f6f85;
  --line:#e1e8f2;--pill:#dce9f8;--code:#1f5fb8;--card:#fff;--ground:#0b1f33;--rail:#34475c;
  --warnbg:#fff3cd;--warnfg:#7a5a00;--okbg:#e3f4ea;--okfg:#1d6b3a;--errbg:#fde7e7;--errfg:#9b1c1c;
  --font:"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  color-scheme:light;box-sizing:border-box
}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;height:var(--app-h,100dvh);background:var(--ground);font-family:var(--font);color:var(--navy);overflow:hidden}
html{padding:0!important}
#root{height:100%}
#app{height:100%;max-width:520px;margin:0 auto;padding:max(8px,env(safe-area-inset-top,0px)) max(8px,env(safe-area-inset-right,0px)) 0 max(8px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;position:relative}
.card{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--card);border-radius:18px;overflow:hidden;box-shadow:0 6px 24px rgba(0,0,0,.4)}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;height:62px;flex:none;padding:0 18px;border-bottom:1px solid var(--line);background:var(--card)}
header .ht{min-width:0}
#hs{display:block;font-size:15px;font-weight:700;color:var(--blue);letter-spacing:.03em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#hp{display:block;font-size:13px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header img{height:21px;flex:none}
#track{flex:1;display:flex;min-height:0;transition:transform .35s cubic-bezier(.3,.7,.2,1)}
.pg{flex:0 0 100%;overflow-y:auto;overflow-x:hidden;padding:18px 18px 28px;display:flex;flex-direction:column;gap:14px}
.pg>*{flex-shrink:0}
.band{background:var(--blue);color:#fff;text-align:center;font-size:10.5px;font-weight:700;letter-spacing:.03em;padding:8px 6px;flex:none}
nav{display:flex;align-items:center;gap:10px;padding:10px 2px calc(12px + env(safe-area-inset-bottom,0px));flex:none}
.nb{font:700 16px var(--font);border:0;color:#fff;background:linear-gradient(#1aa0ec,var(--blue-dk));border-radius:26px;min-height:48px;padding:0 20px;cursor:pointer;box-shadow:0 2px 8px rgba(0,145,220,.4)}
.nb:disabled{opacity:.3;cursor:default}
.hb{width:48px;height:48px;border-radius:50%;border:0;background:#fff;display:grid;place-items:center;cursor:pointer;flex:none}
#prog{flex:1;display:flex;align-items:center;gap:8px;color:#fff;font-size:13px;font-variant-numeric:tabular-nums;min-width:0}
#bar{flex:1;height:5px;background:var(--rail);border-radius:3px}#bar i{display:block;height:100%;width:0;background:var(--blue);border-radius:3px;transition:width .3s}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
nav button:focus-visible{outline-color:#fff}

/* type */
h2{font-size:27px;line-height:1.12;font-weight:800;color:var(--navy);text-wrap:balance}
h3{font-size:19px;line-height:1.2;font-weight:800;color:var(--navy)}
.sub{color:var(--blue);font-size:15px;line-height:1.35;margin-top:4px}
.lead{font-size:15.5px;line-height:1.45;color:var(--ink)}
.grp{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--blue);margin-bottom:-6px}
.note{font-size:12.5px;color:var(--mute);line-height:1.4}
.tag{display:inline-block;font-size:11px;font-weight:700;background:var(--warnbg);color:var(--warnfg);border-radius:4px;padding:2px 6px;vertical-align:middle}
code,.mono{font-family:Consolas,"Roboto Mono",ui-monospace,monospace}

/* cover */
.cover{background:#fff;gap:10px}
.cover h2{font-size:31px;color:#111d2c}
.cover p{font-size:14.5px;line-height:1.42;color:var(--ink)}
.tagl{display:flex;align-items:center;gap:10px}.tagl i{flex:1;height:3px;background:var(--blue)}.tagl span{font-size:13px;font-weight:800;color:#111d2c;white-space:nowrap}
.m2{position:relative;flex:1;min-height:200px}
.m2 .dg{position:absolute;left:50%;top:50%;width:340px;height:290px;transform:translate(-50%,-50%) scale(var(--s,1))}
.m2 svg.ln{position:absolute;inset:0;overflow:visible}
.m2 .nd{position:absolute;width:78px;height:78px;border-radius:50%;background:#fff;border:1px solid var(--line);box-shadow:0 2px 8px rgba(18,41,90,.14);transform:translate(-50%,-50%);padding:0;cursor:pointer;overflow:hidden}
.m2 .nd img{position:absolute;inset:8px;width:calc(100% - 16px);height:calc(100% - 16px);object-fit:contain}
.m2 .ct{position:absolute;left:50%;top:50%;width:122px;height:122px;transform:translate(-50%,-50%);border-radius:50%;background:#fff;border:2px solid #bfdcf1;box-shadow:0 4px 16px rgba(18,41,90,.18)}
.m2 .ct img{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:72%}
.go{background:linear-gradient(#1aa0ec,var(--blue-dk));color:#fff;border:0;border-radius:28px;font:700 17px var(--font);min-height:50px;padding:0 22px;cursor:pointer;width:100%;text-decoration:none;display:flex;align-items:center;justify-content:center;gap:8px}
.go.alt{background:#fff;color:var(--blue);border:2px solid var(--blue)}
.go.sm{min-height:44px;font-size:15px}

/* hub */
.hero{background:var(--navy);color:#fff;border-radius:14px;padding:13px 16px}
.hero h2{color:#fff;font-size:22px}
.hero p{margin-top:5px;font-size:14px;line-height:1.35;opacity:.9}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.tile{border:1px solid var(--line);border-radius:14px;background:#fff;padding:5px 9px 5px 5px;min-height:74px;display:flex;align-items:center;gap:8px;font:inherit;color:var(--navy);cursor:pointer;text-align:left}
.tile .glow{flex:none;width:34%;height:62px;position:relative}
.tile .glow img{position:absolute;inset:0;margin:auto;max-width:100%;max-height:100%}
.tile .glow svg{position:absolute;inset:0;margin:auto}
.tile .tx{display:flex;flex-direction:column;gap:2px;min-width:0}
.tile b{font-size:14.5px;line-height:1.15}
.tile small{font-size:11px;line-height:1.25;color:var(--mute)}
.tile.sup{background:var(--pill);border-color:var(--pill)}
.tile.sup .glow{width:26%}
.tile .cnt{display:inline-block;margin-top:2px;font-size:10.5px;font-weight:700;color:var(--code)}

/* tool rows */
.lk{display:flex;align-items:center;gap:13px;padding:10px 0;border-bottom:1px solid var(--line);text-decoration:none;color:inherit;min-height:64px}
.lk:last-child{border-bottom:0}
.lk .th{flex:none;width:82px;height:46px;border-radius:8px;overflow:hidden;background:#eef3f9;display:grid;place-items:center;border:1px solid var(--line)}
.lk .th img{width:100%;height:100%;object-fit:cover}
.lk .th.ic{background:#fff}
.lk .tx{min-width:0;flex:1}
.lk b{display:block;font-size:16px;color:var(--navy);line-height:1.2}
.lk small{display:block;font-size:13.5px;color:var(--mute);line-height:1.35;margin-top:2px}
.lk em{font-style:normal;font-size:11px;font-weight:700;color:var(--code);background:var(--pill);border-radius:10px;padding:1px 7px;margin-left:6px;vertical-align:1px;white-space:nowrap}
.lk .ar{flex:none;color:var(--blue)}
.list{display:flex;flex-direction:column}

/* which tool */
.q{background:var(--pill);border-radius:12px;padding:11px 13px;display:flex;flex-direction:column;gap:8px}
.q p{font-size:16px;font-weight:700;line-height:1.3;color:var(--navy)}
.q .to{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:38px;padding:3px 12px 3px 4px;border:1px solid var(--line);border-radius:20px;background:#fff;font:700 13px var(--font);color:var(--code);cursor:pointer;text-decoration:none}
.chip i{width:30px;height:30px;border-radius:50%;background:#fff;border:1px solid var(--line);display:grid;place-items:center;overflow:hidden;flex:none}
.chip i img{width:100%;height:100%;object-fit:cover}
.chip.int{color:var(--navy)}

/* contact block */
.contact{background:var(--navy);color:#fff;border-radius:12px;padding:12px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.contact small{display:block;font-size:12px;opacity:.8;text-transform:uppercase;letter-spacing:.05em;font-weight:700}
.contact .addr{font-size:17px;font-weight:700;user-select:all;overflow-wrap:anywhere}
.btn{font:700 14px var(--font);border-radius:20px;min-height:40px;padding:0 16px;border:2px solid rgba(255,255,255,.6);background:transparent;color:#fff;cursor:pointer}
.check{list-style:none;padding:0;display:flex;flex-direction:column}
.check li{display:flex;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:15px;line-height:1.35;color:var(--ink)}
.check li::before{content:"";flex:none;width:16px;height:16px;margin-top:2px;border:2px solid var(--blue);border-radius:4px}
.check li:last-child{border-bottom:0}
.tip{background:var(--pill);border-radius:12px;padding:11px 13px;font-size:14px;line-height:1.4;color:var(--navy)}
.tip strong{display:block;margin-bottom:2px}

/* product pages */
.pic{background:#fff;display:grid;place-items:center;padding:4px 0;border-bottom:1px solid var(--line)}
.pic img{max-height:170px;max-width:86%;object-fit:contain}
.codes{display:flex;flex-wrap:wrap;gap:7px}
.codes span{background:var(--pill);color:var(--code);font-weight:700;font-size:13.5px;padding:5px 12px;border-radius:16px}
.bl{list-style:none;padding:0;display:flex;flex-direction:column}
.bl li{display:flex;gap:11px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line);font-size:15.5px;line-height:1.38;color:var(--ink)}
.bl li:last-child{border-bottom:0}
.bl li::before{content:"";flex:none;width:8px;height:8px;border-radius:50%;background:var(--blue);margin-top:7px}
.bl li b{color:var(--navy)}
.bl ul{list-style:none;padding:3px 0 0;margin:0}
.bl ul li{border:0;padding:2px 0;font-size:14.5px}
.bl ul li::before{width:6px;height:2px;border-radius:0;background:var(--mute);margin-top:9px}
.facts{display:grid;grid-template-columns:auto 1fr;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.facts dt,.facts dd{padding:8px 12px;border-bottom:1px solid var(--line);font-size:14.5px;line-height:1.35}
.facts dt{color:var(--mute);background:#f6f9fd;font-weight:600}
.facts dd{color:var(--navy);font-weight:600;min-width:0;font-variant-numeric:tabular-nums}
.facts dt:nth-last-of-type(1),.facts dd:last-of-type{border-bottom:0}
.fams{display:flex;flex-direction:column;gap:9px}
.fam{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:14px;background:#fff;padding:7px 12px 7px 7px;font:inherit;color:inherit;text-align:left;cursor:pointer;width:100%}
.fam .im{flex:none;width:84px;height:62px;position:relative}
.fam .im img{position:absolute;inset:0;margin:auto;max-width:100%;max-height:100%}
.fam .tx{flex:1;min-width:0}
.fam b{display:block;font-size:17px;color:var(--navy)}
.fam small{display:block;font-size:13.5px;color:var(--mute);line-height:1.3;margin-top:1px}
.fam .ar{flex:none;color:var(--blue);font-size:22px;font-weight:700}
.vt{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.vr{display:grid;grid-template-columns:76px 1fr;gap:10px;align-items:start;padding:8px 12px;border-bottom:1px solid var(--line)}
.vr:last-child{border-bottom:0}
.vr code{font-weight:700;font-size:14px;color:var(--code);padding-top:1px}
.vr span{font-size:14.5px;line-height:1.35;color:var(--ink);min-width:0}
.vr span small{display:block;font-size:12.5px;color:var(--mute)}
.combo{display:flex;gap:12px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:9px 12px 9px 9px;background:#fff}
.combo .im{flex:none;width:76px;height:52px;position:relative}
.combo .im img{position:absolute;inset:0;margin:auto;max-width:100%;max-height:100%}
.combo .tx{flex:1;min-width:0}
.combo b{display:block;font-size:15.5px;color:var(--navy)}
.combo b code{color:var(--code)}
.combo .spec{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:12.5px;font-weight:700;color:var(--code);margin:2px 0 3px;font-variant-numeric:tabular-nums}
.combo small{display:block;font-size:13.5px;color:var(--ink);line-height:1.35}
.cgrp{display:flex;flex-direction:column;gap:8px}
.scroll{overflow-x:auto}
table.sz{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
table.sz th,table.sz td{border-bottom:1px solid var(--line);padding:7px 8px;text-align:left;white-space:nowrap}
table.sz th{font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--mute);background:#f6f9fd}
table.sz td{color:var(--navy);font-weight:600}
.ask{background:#f6f9fd;border:1px solid var(--line);border-radius:12px;padding:11px 13px}
.ask b{display:block;font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--blue);margin-bottom:4px}
.ask ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:3px}
.ask li{font-size:14.5px;line-height:1.35;color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.back{display:flex;flex-direction:column;gap:9px;margin-top:4px}

/* product key */
.pk{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}
.pk img{display:block;width:100%}
.legend{list-style:none;padding:0;display:flex;flex-direction:column}
.legend li{display:grid;grid-template-columns:26px 1fr;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);align-items:start}
.legend li:last-child{border-bottom:0}
.num{width:24px;height:24px;border-radius:50%;background:var(--navy);color:#fff;font-size:13px;font-weight:700;display:grid;place-items:center}
.legend b{display:block;font-size:15.5px;color:var(--navy)}
.legend span{font-size:14px;line-height:1.38;color:var(--ink);display:block}
.legend code{color:var(--code);font-weight:700}

/* data sheets */
.ds{border:1px solid var(--line);border-radius:14px;padding:12px 13px;display:flex;flex-direction:column;gap:9px;background:#fbfdff}
.ds h4{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--blue);display:flex;justify-content:space-between;align-items:center;gap:8px}
.ds h4 span{color:var(--mute);letter-spacing:0;text-transform:none;font-weight:600}
.ds .empty{font-size:14px;color:var(--mute);line-height:1.4}
.dsi{display:flex;align-items:center;gap:11px;padding:7px 0;border-bottom:1px solid var(--line)}
.dsi:last-child{border-bottom:0}
.dsi .fi{flex:none;width:38px;height:46px;border-radius:5px;background:#fff;border:1px solid var(--line);display:grid;place-items:center;font-size:10px;font-weight:800;color:#c0392b;letter-spacing:.02em}
.dsi .fi.img{color:var(--code)}
.dsi .tx{flex:1;min-width:0}
.dsi b{display:block;font-size:15px;color:var(--navy);overflow-wrap:anywhere;line-height:1.25}
.dsi small{display:block;font-size:12.5px;color:var(--mute);font-variant-numeric:tabular-nums}
.dsi .acts{display:flex;gap:6px;flex:none}
.sb{font:700 13px var(--font);min-height:36px;padding:0 12px;border-radius:18px;border:1.5px solid var(--blue);background:#fff;color:var(--blue);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center}
.sb.solid{background:var(--blue);color:#fff}
.sb.del{border-color:#c9d3df;color:var(--mute)}
.sb.del.arm{border-color:var(--errfg);color:#fff;background:var(--errfg)}
.up{display:flex;flex-direction:column;gap:8px;border-top:1px dashed #b9c8d8;padding-top:10px}
.up label{font-size:13px;font-weight:700;color:var(--navy)}
.up input[type=text]{font:15px var(--font);border:1px solid #c9d3df;border-radius:10px;padding:9px 11px;color:var(--navy);width:100%;background:#fff}
.up .row2{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.up .pick{position:relative;overflow:hidden}
.up .pick input{position:absolute;inset:0;opacity:0;cursor:pointer}
.up .fname{font-size:13px;color:var(--mute);min-width:0;overflow-wrap:anywhere;flex:1}
.st{font-size:13.5px;font-weight:700;border-radius:8px;padding:7px 10px;line-height:1.35}
.st.ok{background:var(--okbg);color:var(--okfg)}.st.err{background:var(--errbg);color:var(--errfg)}.st.busy{background:var(--pill);color:var(--code)}
.edtag{font-size:11px;font-weight:700;color:var(--okfg);background:var(--okbg);border-radius:10px;padding:1px 8px}

#toast{position:absolute;left:50%;bottom:92px;transform:translateX(-50%);background:#fff;color:var(--navy);font-weight:700;padding:10px 18px;border-radius:20px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .25s;white-space:nowrap;z-index:5;box-shadow:0 4px 14px rgba(0,0,0,.3)}
#toast.on{opacity:1}

/* save-to-phone sheet */
.bms{position:fixed;inset:0;z-index:20;background:rgba(5,15,28,.6);display:flex;align-items:flex-end;justify-content:center;padding:12px max(12px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.bms-card{width:100%;max-width:480px;max-height:100%;overflow-y:auto;background:#fff;color:var(--navy);border-radius:18px;padding:16px 18px 14px;display:flex;flex-direction:column;gap:12px}
.bms-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.bms h3{font-size:21px}
.bms-x{width:40px;height:40px;border-radius:50%;border:0;background:var(--pill);color:var(--navy);font-size:24px;line-height:1;cursor:pointer;flex:none}
.bms-os{border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.bms-lbl{font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--blue);margin-bottom:4px}
.bms ol{list-style:none;padding:0}
.bms li{display:flex;gap:10px;align-items:flex-start;padding:6px 0;font-size:15px;line-height:1.4;border-bottom:1px solid var(--line)}
.bms li:last-child{border-bottom:0}
.bms li .num{flex:none}
.bms-btns{display:flex;gap:10px}.bms-btns .go{flex:1}

@media (max-height:740px){
  header{height:54px}header img{height:19px}
  nav{padding-top:8px;padding-bottom:calc(8px + env(safe-area-inset-bottom,0px))}
  .nb{min-height:44px}.hb{width:44px;height:44px}
  .band{padding:6px;font-size:9.5px}
  .cover h2{font-size:26px}.m2{min-height:150px}
  .hero p{display:none}
  #toast{bottom:80px}
}
@media (max-width:380px){
  .nb{padding:0 14px;font-size:15px}
  .lk .th{width:64px;height:40px}
  .tile .glow{width:30%}
}
@media (prefers-reduced-motion:reduce){#track,#bar i,#toast{transition:none}}

function fam(key,img,name,sub){return '<button class="fam" data-go="'+key+'"><span class="im">'+im(img,name)+'</span><span class="tx"><b>'+name+'</b><small>'+sub+'</small></span><span class="ar">›</span></button>'}
function vr(a){return '<div class="vt">'+a.map(function(r){return '<div class="vr"><code>'+r[0]+'</code><span>'+r[1]+(r[2]?'<small>'+r[2]+'</small>':'')+'</span></div>'}).join('')+'</div>'}
function combo(img,title,spec,txt){return '<div class="combo"><span class="im">'+im(img,'')+'</span><span class="tx"><b>'+title+'</b><span class="spec">'+spec.map(function(s){return '<span>'+s+'</span>'}).join('')+'</span><small>'+txt+'</small></span></div>'}
function dsBox(k,label){return '<section class="ds" data-k="'+k+'" data-l="'+esc(label)+'"></section>'}
function back(a){return '<div class="back">'+a.map(function(b,ix){return '<button class="go'+(ix?' alt':'')+'" data-go="'+b[0]+'">'+b[1]+'</button>'}).join('')+'</div>'}
function generalNote(){return '<p class="note">General overview to help the conversation. Check the data sheet or the online shop before quoting a part number.</p>'}

 bl(['<b>Vacuum generators (ejectors)</b> make vacuum from compressed air, from basic VN units to OVEM with built-in valves and sensor','<b>Suction cups</b> in many shapes and materials for flat, curved, oily or delicate parts','<b>Vacuum filters, switches and sensors</b> to protect the system and confirm the part is held','<b>Bernoulli grippers</b> for very thin or delicate parts, with almost no contact'])+
 ask(['What is the part: weight, size, surface, material?','Is it porous, like card or wood?','How fast is the cycle?','Is there a vacuum pump already, or only compressed air?'])+
 generalNote()+tools(['vacd','grip','shop'])+
 dsBox('vac','Vacuum')+
 back([['ele','Next: electric drives →'],['hub','Back to categories']]));

add('ele','Electric drives','Overview',
 '<div class="pic">'+im('electric','Electric axis')+'</div>'+
 head('Electric drives','Precise, programmable motion: many positions, controlled speed and force.')+
 bl(['<b>Electric axes</b> with toothed belt or spindle, for example ELGC, EGC and ELGA','<b>Electric cylinders</b> to replace a pneumatic cylinder, for example EPCO','<b>Simplified Motion Series</b> with the drive built in, set up like a pneumatic cylinder','<b>Servo and stepper motors</b> with their <b>controllers</b>, for example EMMT and CMMT','<b>Handling systems</b>: gantries and pick-and-place built from axes'])+
 ask(['Load and stroke','How many positions, and how accurate?','Speed or cycle time','How is it controlled: I/O, IO-Link or fieldbus?','Would a pneumatic cylinder be enough? Compare in CO2 and TCO guide'])+
 generalNote()+tools(['ems','hgo','co2','suite'])+
 dsBox('ele','Electric drives')+
 back([['pa','Next: process automation →'],['hub','Back to categories']]));

add('pa','Process automation','Overview',
 '<div class="pic">'+im('pa','Quarter turn actuator')+'</div>'+
 head('Process automation','Valves and actuators that control liquids and gases in process plants.')+
 bl(['<b>Quarter-turn actuators</b> that open and close ball and butterfly valves, for example DFPD','<b>Process valves:</b> ball, butterfly and angle seat valves','<b>Sensor boxes</b> that report open or closed to the control','<b>NAMUR solenoid valves</b> that mount straight onto the actuator','<b>Control cabinets</b> built to order for the plant'])+
 ask(['What is the medium, its temperature and pressure?','Pipe size and connection type','On/off or modulating control?','Fail safe: spring return to open or closed?','Any approvals: ATEX, food, water?'])+
 generalNote()+tools(['pvc','cab','media'])+
 dsBox('pa','Process automation')+
 back([['hub','Back to categories']]));

/* ---------- shell ---------- */
var SHELL='<div id="app"><div class="card"><header><div class="ht"><b id="hs">FESTO</b><span id="hp"></span></div>'+im('logo','Festo')+'</header><div id="track"></div><div class="band">COMPLETE SOLUTIONS · HIGHER PERFORMANCE · GREATER RELIABILITY · ADDED VALUE</div></div>'+
 '<nav><button class="nb" id="bk">← Back</button><button class="hb" id="hm" aria-label="Categories"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#12295a" stroke-width="2.2" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-8 9 8v10h-6v-6H9v6H3z"/></svg></button><div id="prog"><div id="bar"><i></i></div><span id="pn"></span></div><button class="nb" id="nx">Next →</button></nav>'+
 '<div id="toast" role="status" aria-live="polite"></div></div>'+
 '<div id="bms" class="bms" hidden role="dialog" aria-modal="true" aria-labelledby="bms-h"><div class="bms-card"><div class="bms-top"><h3 id="bms-h">Save to your phone</h3><button class="bms-x" id="bms-x" aria-label="Close">×</button></div>'+
 '<p class="lead">Add the guide to your home screen so it opens like an app.</p>'+
 '<div class="bms-os" data-os="ios"><div class="bms-lbl">iPhone and iPad (Safari)</div><ol><li><span class="num">1</span><span>Tap <b>Share</b> at the bottom of the screen (top right on iPad).</span></li><li><span class="num">2</span><span>Scroll down and tap <b>Add to Home Screen</b>.</span></li><li><span class="num">3</span><span>Tap <b>Add</b>.</span></li></ol></div>'+
 '<div class="bms-os" data-os="android"><div class="bms-lbl">Android (Chrome)</div><ol><li><span class="num">1</span><span>Tap the <b>⋮</b> menu at the top right.</span></li><li><span class="num">2</span><span>Tap <b>Add to Home screen</b> (it may say <b>Install app</b>).</span></li><li><span class="num">3</span><span>Tap <b>Add</b>.</span></li></ol></div>'+
 '<p class="note">Opened from a QR scanner, Teams or Outlook? Open the guide in Safari or Chrome first.</p>'+
 '<div class="bms-btns"><button class="go alt sm" id="bms-copy">Copy link</button><button class="go sm" id="bms-ok">Done</button></div></div></div>';

var root=document.getElementById('root');
root.innerHTML=SHELL;
var tr=document.getElementById('track');
tr.innerHTML=PAGES.map(function(p){return '<section class="pg '+p.cls+'" data-key="'+p.key+'">'+p.html+'</section>'}).join('');
var pg=[].slice.call(tr.children),N=pg.length,cur=0;
var KEYIX={};PAGES.forEach(function(p,ix){KEYIX[p.key]=ix});

function go(n){if(n<0||n>=N)return;cur=n;tr.style.transform='translateX(-'+n*100+'%)';var p=PAGES[n],el=pg[n];el.scrollTop=0;
 var f=p.s=='Festo';document.getElementById('hs').textContent=f?p.p:p.s;document.getElementById('hp').textContent=f?'':p.p;
 document.getElementById('pn').textContent=(n+1)+'/'+N;document.querySelector('#bar i').style.width=((n+1)/N*100)+'%';
 var c=n==0;document.getElementById('bk').hidden=c;document.getElementById('hm').hidden=c;document.getElementById('nx').disabled=n==N-1;
 pg.forEach(function(x,ix){x.setAttribute('aria-hidden',ix==n?'false':'true');x.inert=ix!=n});
 if(n==0)fit();
}
function goKey(k){if(k in KEYIX)go(KEYIX[k])}
function fit(){var m=document.querySelector('.m2');if(!m)return;var d=m.firstChild;d.style.setProperty('--s',Math.max(.4,Math.min(m.clientWidth/340,m.clientHeight/290,1.15)))}

document.getElementById('bk').onclick=function(){go(cur-1)};
document.getElementById('nx').onclick=function(){go(cur+1)};
document.getElementById('hm').onclick=function(){goKey('hub')};
document.addEventListener('click',function(e){var b=e.target.closest('[data-go]');if(b){e.preventDefault();goKey(b.getAttribute('data-go'))}});
var sx,sy;tr.addEventListener('touchstart',function(e){sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});
tr.addEventListener('touchend',function(e){var dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.5&&!e.target.closest('.scroll,input'))go(cur+(dx<0?1:-1))},{passive:true});
document.addEventListener('keydown',function(e){if(e.target.closest&&e.target.closest('input'))return;if(e.key=='ArrowRight')go(cur+1);if(e.key=='ArrowLeft')go(cur-1);if(e.key=='Home')go(0)});

/* toast + copy */
var toastEl=document.getElementById('toast');
function say(m){toastEl.textContent=m;toastEl.classList.add('on');clearTimeout(say.h);say.h=setTimeout(function(){toastEl.classList.remove('on')},2400)}
document.addEventListener('click',function(e){var b=e.target.closest('[data-copy]');if(!b)return;var t=b.getAttribute('data-copy');
 var fb=function(){var a=b.parentNode.querySelector('.addr');if(a){try{var r=document.createRange();r.selectNodeContents(a);var s=getSelection();s.removeAllRanges();s.addRange(r)}catch(x){}}say('Selected. Copy it from the menu')};
 try{navigator.clipboard.writeText(t).then(function(){say('Copied')},fb)}catch(x){fb()}});

/* save to phone */
var bms=document.getElementById('bms');
function bmOS(){var u=navigator.userAgent||'';if(/iPad|iPhone|iPod/.test(u)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1))return'ios';if(/Android/i.test(u))return'android';return''}
document.getElementById('savehome').onclick=function(){var os=bmOS();
 var touch=(window.matchMedia&&matchMedia('(pointer:coarse)').matches)||os!=='';
 if(!touch){say('Press '+(/Mac/.test(navigator.platform||'')?'⌘ + D':'Ctrl + D')+' to bookmark');return}
 [].forEach.call(bms.querySelectorAll('.bms-os'),function(b){b.hidden=!!os&&b.getAttribute('data-os')!==os});bms.hidden=false;document.getElementById('bms-ok').focus()};
function bmClose(){bms.hidden=true}
document.getElementById('bms-x').onclick=bmClose;document.getElementById('bms-ok').onclick=bmClose;
bms.addEventListener('click',function(e){if(e.target===bms)bmClose()});
document.getElementById('bms-copy').onclick=function(){var u=location.href.split('#')[0];try{navigator.clipboard.writeText(u).then(function(){say('Link copied')},function(){say('Copy the link from the address bar')})}catch(x){say('Copy the link from the address bar')}};

/* ---------- data sheets ---------- */
var CAP={assets:null,artifact:null,downloads:null,editor:false,readOnly:false};
function fmtSize(b){if(!b)return'';return b>=1048576?(b/1048576).toFixed(1)+' MB':Math.max(1,Math.round(b/1024))+' KB'}
function fmtDate(s){try{var d=new Date(s);return d.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'})}catch(x){return''}}
function itemsFor(k){return DS.items.filter(function(x){return x.k===k})}
function blobUrl(id){return '/_blob/'+id}
function renderDS(box){
 var k=box.getAttribute('data-k'),label=box.getAttribute('data-l'),its=itemsFor(k);
 var h='<h4>Data sheets'+(CAP.editor?'<span class="edtag">You can add files</span>':'<span>'+its.length+'</span>')+'</h4>';
 var off=!(window.claude&&typeof window.claude.use==='function');
 if(!its.length)h+=off?'<p class="empty">Get the latest data sheet for '+esc(label)+' from Festo:</p><div class="chips">'+toolChip('docs')+toolChip('shop')+'</div>':'<p class="empty">No data sheets added for '+esc(label)+' yet.'+(CAP.editor?' Add a PDF or image below.':'')+'</p>';
 else h+='<div>'+its.map(function(x){var pdf=/pdf/.test(x.type||'');return '<div class="dsi"><span class="fi'+(pdf?'':' img')+'">'+(pdf?'PDF':'IMG')+'</span><span class="tx"><b>'+esc(x.name)+'</b><small>'+[fmtSize(x.size),x.added?'added '+fmtDate(x.added):''].filter(Boolean).join(' · ')+'</small></span><span class="acts"><a class="sb solid" href="'+blobUrl(x.id)+'" target="_blank" rel="noopener">Open</a>'+(CAP.downloads?'<button class="sb" data-save="'+x.id+'">Save</button>':'')+(CAP.editor?'<button class="sb del" data-del="'+x.id+'" aria-label="Remove '+esc(x.name)+'">Remove</button>':'')+'</span></div>'}).join('')+'</div>';
 if(CAP.editor){var id='f-'+k;h+='<div class="up"><label for="n-'+k+'">Add a data sheet</label><div class="row2"><span class="sb pick">Choose file<input type="file" id="'+id+'" accept="application/pdf,image/png,image/jpeg,image/webp" data-file="'+k+'"></span><span class="fname" data-fname="'+k+'">PDF, PNG, JPG or WebP, up to 20 MB</span></div><input type="text" id="n-'+k+'" placeholder="Name shown to staff, e.g. ADN data sheet" maxlength="80"><button class="go sm" data-up="'+k+'">Add data sheet</button><div class="st" data-st="'+k+'" hidden></div></div>'}
 box.innerHTML=h;
}
function renderAllDS(){[].forEach.call(document.querySelectorAll('.ds'),renderDS);
 [].forEach.call(document.querySelectorAll('[data-cnt]'),function(el){var k=el.getAttribute('data-cnt');var n=DS.items.filter(function(x){return x.k===k||x.k.indexOf(k+'-')===0}).length;el.textContent=n?n+' data sheet'+(n>1?'s':''):''})}
function status(k,cls,msg){var el=document.querySelector('[data-st="'+k+'"]');if(!el)return;el.hidden=!msg;el.className='st '+cls;el.textContent=msg}

function buildDoc(data){
 var css=document.getElementById('css').textContent,js=document.getElementById('appjs').textContent;
 var json=JSON.stringify(data).replace(/</g,'\\u003c');
 return SKEL+'\n'+TITLE+'<style id="css">'+css+'</style><div id="root"></div><script type="application/json" id="ds">'+json+'<\/script><script id="appjs">'+js+'<\/script>\n</body></html>';
}
var saving=false;
function save(next,k,onFail){
 if(!CAP.artifact){status(k,'err','Saving is not available in this view.');onFail&&onFail();return}
 saving=true;try{sessionStorage.setItem('ftg-page',PAGES[cur].key)}catch(x){}
 CAP.artifact.publish(buildDoc(next)).then(function(){status(k,'ok','Saved. Reloading…')},function(err){
  saving=false;var c=err&&err.code;
  if(c==='conflict')status(k,'err','Someone else saved a change at the same time. The page is reloading; add the file again.');
  else if(c==='not_writer'||c==='not_granted'||c==='consent_required'){status(k,'err','You can view data sheets here but not change them.');CAP.editor=false}
  else if(c==='too_large')status(k,'err','The guide is too large to save. Remove an old data sheet first.');
  else if(c==='rate_limited')status(k,'err','Too many saves in a row. Wait a minute and try again.');
  else status(k,'err','Could not save just now. Try again in a moment.');
  onFail&&onFail(c);
 });
}
document.addEventListener('change',function(e){var inp=e.target.closest('[data-file]');if(!inp)return;var k=inp.getAttribute('data-file'),f=inp.files&&inp.files[0];
 var fn=document.querySelector('[data-fname="'+k+'"]');if(fn)fn.textContent=f?f.name+' · '+fmtSize(f.size):'PDF, PNG, JPG or WebP, up to 20 MB';
 var nm=document.getElementById('n-'+k);if(f&&nm&&!nm.value)nm.value=f.name.replace(/\.[^.]+$/,'').replace(/[_-]+/g,' ');status(k,'','')});
document.addEventListener('click',function(e){
 var up=e.target.closest('[data-up]');
 if(up){var k=up.getAttribute('data-up'),inp=document.getElementById('f-'+k),f=inp&&inp.files&&inp.files[0];
  if(saving)return;
  if(!f){status(k,'err','Choose a file first.');return}
  var ext=(f.name.split('.').pop()||'').toLowerCase(),type={pdf:'application/pdf',png:'image/png',jpg:'image/jpeg',jpeg:'image/jpeg',webp:'image/webp'}[ext];
  if(!type){status(k,'err','Use a PDF, PNG, JPG or WebP file.');return}
  if(f.size>20*1048576){status(k,'err','That file is over 20 MB. Use a smaller copy.');return}
  var name=(document.getElementById('n-'+k).value||f.name).trim().slice(0,80);
  up.disabled=true;status(k,'busy','Uploading '+f.name+'…');
  CAP.assets.upload(f,{type:type}).then(function(r){
   status(k,'busy','Saving to the guide…');
   var next={items:DS.items.concat([{id:r.id,k:k,name:name,type:r.contentType||type,size:r.sizeBytes||f.size,added:new Date().toISOString()}])};
   save(next,k,function(code){up.disabled=false;if(code!=='conflict')CAP.assets.delete(r.id).catch(function(){})});
  },function(err){up.disabled=false;var c=err&&err.code;
   status(k,'err',c==='too_large'?'That file is too large.':c==='unsupported_type'?'That file type is not accepted. Use PDF or an image.':c==='quota_or_state'?'Storage for this guide is full. Remove an old data sheet first.':c==='rate_limited'?'Too many uploads in a row. Wait a minute and try again.':'Upload failed. Try again in a moment.')});
  return}
 var del=e.target.closest('[data-del]');
 if(del){var id=del.getAttribute('data-del'),box=del.closest('.ds'),k2=box.getAttribute('data-k');
  if(!del.classList.contains('arm')){del.classList.add('arm');del.textContent='Tap to confirm';setTimeout(function(){if(del.isConnected&&!saving){del.classList.remove('arm');del.textContent='Remove'}},4000);return}
  if(saving)return;del.disabled=true;
  var ensureSt=box.querySelector('[data-st]');if(!ensureSt){var d=document.createElement('div');d.className='st';d.setAttribute('data-st',k2);box.appendChild(d)}
  status(k2,'busy','Removing…');
  CAP.assets.delete(id).catch(function(){}).then(function(){save({items:DS.items.filter(function(x){return x.id!==id})},k2,function(){del.disabled=false})});
  return}
 var sv=e.target.closest('[data-save]');
 if(sv){var sid=sv.getAttribute('data-save'),it=DS.items.filter(function(x){return x.id===sid})[0];if(!it)return;
  sv.disabled=true;fetch(blobUrl(sid)).then(function(r){if(!r.ok)throw 0;return r.blob()}).then(function(b){
   var ext=/pdf/.test(it.type)?'.pdf':/png/.test(it.type)?'.png':/webp/.test(it.type)?'.webp':'.jpg';
   return CAP.downloads.save({filename:it.name.replace(/[\\\/:*?"<>|]+/g,' ').trim()+ext,data:b})}).then(function(res){sv.disabled=false;if(res&&res.status==='saved')say('Saved')},function(err){sv.disabled=false;if(!(err&&err.code==='declined'))say('Could not save. Use Open instead.')});
 }
});

renderAllDS();
var startKey=null;try{startKey=sessionStorage.getItem('ftg-page');sessionStorage.removeItem('ftg-page')}catch(x){}
if(!startKey){var h=(location.hash||'').slice(1);if(h in KEYIX)startKey=h}
go(startKey&&startKey in KEYIX?KEYIX[startKey]:0);
function setH(){var hh=window.innerHeight;if(hh>0)document.documentElement.style.setProperty('--app-h',hh+'px');fit()}
setH();addEventListener('resize',setH);addEventListener('orientationchange',function(){setTimeout(setH,300)});addEventListener('pageshow',setH);

/* capabilities: light up editing for people who can edit, and Save for everyone where offered */
if(window.claude&&typeof window.claude.use==='function'){
 Promise.all(['assets','artifact','downloads'].map(function(n){return window.claude.use(n).catch(function(){return null})})).then(function(r){
  CAP.assets=r[0];CAP.artifact=r[1];CAP.downloads=r[2];CAP.editor=!!(CAP.assets&&CAP.artifact);renderAllDS();
 });
}
})();
</script>
</body></html>
