<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Flowtech PA Guide</title><style>/* Flowtech PA app, styled to match the deck mock-up: white screen, Flowtech logo, Festo-blue band, grey tiles, sage Flowtech button */
:root{
  --blue:#0091dc;--blue-dk:#0079bd;--dark:#22313b;--text:#333333;--grey:#717d86;--grey2:#b6bec6;
  --light:#e5e8eb;--bg2:#f3f5f7;--pale:#c8e6fa;--sage:#7aa79c;--sage-dk:#668f85;
  --font:Arial,"Helvetica Neue",Helvetica,sans-serif;color-scheme:light
}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;height:var(--app-h,100dvh);background:var(--dark);font-family:var(--font);color:var(--text);overflow:hidden}
#root{height:100%}
#app{height:100%;max-width:520px;margin:0 auto;padding-block:max(10px,env(safe-area-inset-top,0px)) 0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column}
.card{flex:1;min-height:0;display:flex;flex-direction:column;background:#fff;border-radius:22px;overflow:hidden;box-shadow:0 8px 28px rgba(0,0,0,.35)}
header{flex:none;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px 12px;background:#fff}
header img{height:34px;width:auto}
header .pgc{font-size:12px;color:var(--grey);font-variant-numeric:tabular-nums}
.ttl{flex:none;background:var(--blue);color:#fff;padding:11px 18px;display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.ttl b{font-size:16px;font-weight:700}
.ttl span{font-size:12px;opacity:.85;white-space:nowrap}
#track{flex:1;display:flex;min-height:0;transition:transform .35s cubic-bezier(.3,.7,.2,1)}
.pg{flex:0 0 100%;overflow-y:auto;overflow-x:hidden;padding:16px 16px 26px;display:flex;flex-direction:column;gap:14px;overscroll-behavior:contain}
.pg>*{flex-shrink:0}
.band{flex:none;background:var(--bg2);color:var(--grey);text-align:center;font-size:11.5px;padding:8px 12px;border-top:1px solid var(--light)}
.band a{color:var(--blue);font-weight:700;text-decoration:none}
nav{flex:none;display:flex;align-items:center;gap:10px;padding:10px 2px calc(12px + env(safe-area-inset-bottom,0px))}
.nb{font:700 15px var(--font);border:0;color:#fff;background:var(--blue);border-radius:24px;min-height:46px;padding:0 18px;cursor:pointer}
.nb:disabled{opacity:.3;cursor:default}
.hb{width:46px;height:46px;border-radius:50%;border:0;background:#fff;display:grid;place-items:center;cursor:pointer;flex:none}
#prog{flex:1;height:5px;background:#3a4955;border-radius:3px}#prog i{display:block;height:100%;width:0;background:var(--blue);border-radius:3px;transition:width .3s}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--blue);outline-offset:2px}

/* type */
h2{font-size:24px;line-height:1.15;font-weight:700;color:var(--text)}
h3{font-size:18px;line-height:1.25;font-weight:700;color:var(--text)}
.sub{color:var(--grey);font-size:14.5px;line-height:1.4;margin-top:5px}
.grp{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--blue);margin-bottom:-6px}
.note{font-size:12px;color:var(--grey);line-height:1.4}

/* buttons */
.go{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:48px;padding:0 20px;border-radius:24px;border:0;background:var(--blue);color:#fff;font:700 15px var(--font);text-decoration:none;cursor:pointer}
.go.alt{background:#fff;color:var(--blue);border:2px solid var(--blue)}
.go.sm{min-height:42px;font-size:14px}
.go.ft{background:var(--sage);color:#fff}
.back{display:flex;flex-direction:column;gap:9px}

/* control room to field chain */
.chain{position:relative;display:grid;grid-template-columns:repeat(4,1fr);padding-top:2px}
.chain::before{content:"";position:absolute;left:12.5%;right:12.5%;top:9px;height:2px;background:var(--grey2)}
.chain div{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11.5px;color:var(--grey)}
.chain div i{width:16px;height:16px;border-radius:50%;background:var(--grey);border:3px solid #fff;box-shadow:0 0 0 1px var(--grey2)}
.chain div.on i{background:var(--blue);box-shadow:0 0 0 1px var(--blue)}

/* cover */
.cov h2{font-size:28px}
.cov p{font-size:14.5px;line-height:1.45;color:var(--text)}
.ctiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ctile{background:var(--bg2);border-radius:14px;padding:10px 8px 9px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;border:0;font:inherit;color:inherit;cursor:pointer}
.ctile .fim{height:86px;width:100%;position:relative}
.ctile .fim img{position:absolute;inset:0;margin:auto;max-width:92%;max-height:92%;mix-blend-mode:multiply}
.ctile b{font-size:13px;color:var(--text)}
.ctile small{font-size:11px;color:var(--grey);line-height:1.25}
.ptn{display:flex;align-items:center;gap:12px;justify-content:center;padding:4px 0}
.ptn small{font-size:12px;color:var(--grey)}
.ptn img{height:20px;width:auto}
.disc{background:var(--bg2);border-radius:10px;padding:9px 12px;font-size:12px;line-height:1.4;color:var(--text)}
.disc a{color:var(--blue);font-weight:700}

/* PA products page (class names kept from the Tools Guide) */
.pap-find{display:flex;gap:8px;align-items:center;border:1.5px solid var(--light);border-radius:24px;padding:0 6px 0 16px;background:var(--bg2)}
.pap-find:focus-within{border-color:var(--blue);background:#fff}
.pap-find input{flex:1;min-width:0;border:0;font:16px var(--font);color:var(--text);padding:11px 0;background:transparent;outline:none}
.pap-find button{border:0;background:var(--pale);color:var(--blue-dk);font:700 12px var(--font);border-radius:16px;padding:6px 10px;cursor:pointer}
.pap-lvl{position:relative;display:grid;grid-template-columns:repeat(5,1fr);padding-top:2px}
.pap-lvl::before{content:"";position:absolute;left:10%;right:10%;top:11px;height:2px;background:var(--grey2)}
.pap-lvl button{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;border:0;background:none;font:12px var(--font);color:var(--grey);cursor:pointer;padding:0 2px 4px}
.pap-lvl button::before{content:"";width:20px;height:20px;border-radius:50%;background:var(--grey2);border:4px solid #fff;box-shadow:0 0 0 1px var(--grey2)}
.pap-lvl button[aria-pressed=true]{color:var(--blue);font-weight:700}
.pap-lvl button[aria-pressed=true]::before{background:var(--blue);box-shadow:0 0 0 1px var(--blue)}
.pap-list{display:flex;flex-direction:column;gap:14px}
.pap-band{background:var(--dark);color:#fff;border-radius:12px;padding:10px 14px;font-size:14.5px;font-weight:700;display:flex;justify-content:space-between;align-items:center}
.pap-band small{font-weight:400;font-size:12px;color:var(--grey2)}
.pap-g{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pap-t{background:var(--bg2);border:1.5px solid transparent;border-radius:14px;padding:9px 8px 10px;display:flex;flex-direction:column;align-items:center;gap:3px;font:inherit;color:var(--text);cursor:pointer;text-align:center;min-width:0}
.pap-t .fim{height:78px;width:100%;position:relative;display:block}
.pap-t .fim img{position:absolute;inset:0;margin:auto;max-width:92%;max-height:92%;mix-blend-mode:multiply}
.pap-t b{font-size:13px;line-height:1.2;margin-top:4px;overflow-wrap:anywhere}
.pap-t small{font-size:11px;line-height:1.25;color:var(--grey)}
.pap-t[aria-pressed=true]{border-color:var(--blue);background:#fff}
.pap-d{grid-column:1/-1;border:1.5px solid var(--blue);border-radius:16px;background:#fff;padding:14px;display:flex;flex-direction:column;gap:10px}
.pap-d .dim{background:var(--bg2);border-radius:12px;display:grid;place-items:center;padding:10px}
.pap-d .dim img{max-height:140px;max-width:90%;object-fit:contain;mix-blend-mode:multiply}
.pap-d .crumb{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--grey)}
.pap-d .row{display:flex;gap:8px;flex-wrap:wrap}
.pap-b{font:700 14px var(--font);border-radius:20px;min-height:40px;padding:0 16px;border:2px solid var(--blue);background:#fff;color:var(--blue);cursor:pointer}
.pap-b.fill{background:var(--blue);color:#fff}
.pap-b.x{border-color:var(--light);color:var(--grey)}
.pap-none{font-size:14px;color:var(--grey);padding:6px 2px}
.codes{display:flex;flex-wrap:wrap;gap:7px}
.codes span{background:var(--pale);color:var(--blue-dk);font-weight:700;font-size:13.5px;padding:5px 12px;border-radius:16px}
.pap-cust{display:flex;flex-direction:column;background:var(--bg2);border-radius:14px;overflow:hidden}
.pap-cust img{display:block;width:100%;max-height:200px;object-fit:contain;background:#fff}
.bl{list-style:none;padding:0;display:flex;flex-direction:column}
.bl li{display:flex;gap:11px;align-items:flex-start;padding:9px 14px;border-bottom:1px solid var(--light);font-size:14.5px;line-height:1.38;color:var(--text)}
.bl li:last-child{border-bottom:0}
.bl li::before{content:"";flex:none;width:8px;height:8px;border-radius:50%;background:var(--blue);margin-top:6px}
.ftc img{height:46px;width:auto}
@media (max-height:700px){header img{height:28px}.ctile .fim{height:66px}.cov h2{font-size:24px}}
@media (prefers-reduced-motion:reduce){#track,#prog i{transition:none}}
